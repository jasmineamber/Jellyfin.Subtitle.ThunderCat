name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Jellyfin SDK 10.10.7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            nuget.config

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ThunderCat.sln -p:JellyfinVersion=10.10.7

      - name: Build and test
        run: dotnet test Jellyfin.Plugin.ThunderCat.sln --configuration Release --no-restore -p:JellyfinVersion=10.10.7 --warnaserror
